[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-twin-stick"
version = "0.9.0"
description = "4 mecanum wheel robot controlled by a twin stick controller UI"
readme = "README.md"
requires-python = ">=3.7"
dependencies = [
    "flask",
    "flask-socketio",
    "eventlet",
    "adafruit-circuitpython-motorkit",
    "pyopenssl"
]

[project.urls]
"Homepage" = "https://github.com/yourusername/robot-twin-stick"
