[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-twin-stick"
version = "0.9.0"
description = "4 mecanum wheel robot controlled by a twin stick controller UI"
readme = "README.md"
requires-python = ">=3.7"
dependencies = [
    "flask",
    "flask-socketio",
    "eventlet",
    "adafruit-circuitpython-motorkit",
    "pyopenssl",
    "RPi.GPIO",
    "adafruit-blinka"
]

[project.urls]
"Homepage" = "https://github.com/yourusername/robot-twin-stick"

[tool.setuptools]
# By default, setuptools scans for any directories with __init__.py or just general directories
# in flat layouts. We explicitly exclude the non-code directories to avoid build errors.
exclude-package-data = { "*" = ["templates", "printed_parts", "static"] }

[tool.setuptools.packages.find]
# "flat-layout" is the default for root-level modules, but we can clarify exclusions here too
where = ["."]
include = ["*"]
exclude = ["templates*", "printed_parts*", "static*"]
