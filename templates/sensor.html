<!DOCTYPE html>
<html>
<head>
    <title>Robot SENSOR</title>
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <style>
        body {
            background: black;
            color: lime;
            font-family: monospace;
            text-align: center;
            padding-top: 20px;
        }

        #val {
            font-size: 3em;
        }

        #accel {
            font-size: 1.2em;
            margin-top: 10px;
            color: cyan;
        }

        #status {
            margin-top: 20px;
            font-size: 0.9em;
            color: #888;
            min-height: 1.2em;
        }

        #controller-link {
            margin-top: 20px;
            font-size: 1.2em;
        }

        #controller-link a {
            color: yellow;
            text-decoration: none;
            border: 1px solid yellow;
            padding: 10px;
            display: inline-block;
            border-radius: 5px;
        }
    </style>
</head>
<body>
<h1>SENSOR ACTIVE</h1>
<div>Heading:</div>
<div id="val">0</div>
<div id="accel">Accel: 0.00, 0.00, 0.00</div>

<div id="status">Ready</div>

<div id="controller-link">
    Waiting for Controller URL...
</div>

<p>Mount phone flat on robot.</p>
<button onclick="requestPerms()">Start Sensors</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.8.1/socket.io.js"></script>
<script>
    const socket = io();
    const disp = document.getElementById('val');
    const accelDisp = document.getElementById('accel');
    const statusDiv = document.getElementById('status');
    const linkDiv = document.getElementById('controller-link');

    let currentHeading = 0;
    let currentAccel = { x: 0, y: 0, z: 0 };
    let sensorsActive = false;

    function updateStatus(msg, level = 'info') {
        statusDiv.innerText = msg;
        if (level === 'error') {
            statusDiv.style.color = 'red';
            console.error(msg);
        } else if (level === 'warn') {
            statusDiv.style.color = 'orange';
            console.warn(msg);
        } else if (level === 'debug') {
             console.debug(msg);
        } else {
            statusDiv.style.color = 'lime';
            console.info(msg);
        }
    }

    // Socket.IO Events
    socket.on('connect', () => {
        updateStatus('Socket connected');
    });

    socket.on('disconnect', () => {
        updateStatus('Socket disconnected', 'warn');
    });

    socket.on('connect_error', (err) => {
        updateStatus('Socket error: ' + err.message, 'error');
    });

    socket.on('robot_status', (data) => {
        // data.url, data.battery
        if (data.url) {
            linkDiv.innerHTML = `<a href="${data.url}" target="_blank">Open Controller</a><br><small>${data.url}</small>`;
        }
        // Could display battery here if data.battery is set
    });

    // Prevent screen sleep
    async function wakeLock() {
        if (!('wakeLock' in navigator)) {
            updateStatus('Wake Lock API not supported', 'warn');
            return;
        }
        try {
            await navigator.wakeLock.request('screen');
            updateStatus('Wake Lock active');
        } catch (err) {
            updateStatus('Wake Lock failed: ' + err.message, 'error');
        }
    }

    wakeLock();

    function handleOrientation(event) {
        // Alpha is usually the compass heading (0-360)
        if (event.alpha !== null) {
            currentHeading = event.alpha;
            disp.innerText = Math.round(currentHeading);
        }
    }

    function handleMotion(event) {
        // acceleration excluding gravity
        const a = event.acceleration;
        if (a) {
            currentAccel = {
                x: a.x || 0,
                y: a.y || 0,
                z: a.z || 0
            };
            accelDisp.innerText = `Accel: ${currentAccel.x.toFixed(2)}, ${currentAccel.y.toFixed(2)}, ${currentAccel.z.toFixed(2)}`;
        }
    }

    // Transmission Loop (100ms)
    setInterval(() => {
        if (sensorsActive) {
            socket.emit('sensor_data', {
                heading: currentHeading,
                ax: currentAccel.x,
                ay: currentAccel.y,
                az: currentAccel.z
            });
        }
    }, 100);

    function requestPerms() {
        if (!window.DeviceOrientationEvent) {
             updateStatus('DeviceOrientationEvent not supported', 'error');
             return;
        }

        console.debug('Requesting sensor permissions...');

        // iOS requires explicit permission
        if (typeof DeviceOrientationEvent.requestPermission === 'function') {
            DeviceOrientationEvent.requestPermission()
                .then(response => {
                    if (response === 'granted') {
                        window.addEventListener('deviceorientation', handleOrientation);
                        updateStatus('Orientation granted');

                        // Try requesting motion permission
                        if (typeof DeviceMotionEvent.requestPermission === 'function') {
                            return DeviceMotionEvent.requestPermission();
                        } else {
                            // Non-iOS or older iOS where one permission might cover both or Motion doesn't need it
                            window.addEventListener('devicemotion', handleMotion);
                            sensorsActive = true;
                            updateStatus('Sensors active (Motion implied)');
                            return null;
                        }
                    } else {
                        throw new Error('Orientation permission denied');
                    }
                })
                .then(response => {
                    if (response === 'granted') {
                        window.addEventListener('devicemotion', handleMotion);
                        sensorsActive = true;
                        updateStatus('All Sensors active');
                    }
                })
                .catch(err => {
                    updateStatus('Permission error: ' + err.message, 'error');
                });
        } else {
            // Non-iOS
            window.addEventListener('deviceorientation', handleOrientation);
            window.addEventListener('devicemotion', handleMotion);
            sensorsActive = true;
            updateStatus('Sensors started (non-iOS)');
        }
    }
</script>
</body>
</html>
